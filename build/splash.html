<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title></title>
    <script>
      const splashTheme = new URLSearchParams(location.search).get('theme')
      if (splashTheme === 'dark') document.documentElement.dataset.theme = 'dark'
      if (splashTheme === 'light') document.documentElement.dataset.theme = 'light'
    </script>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #f8f8f6; }
      :root[data-theme='dark'] body { background: #141416; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) body { background: #141416; }
      }
    </style>
  </head>
  <body></body>
</html>
