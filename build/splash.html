<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title></title>
    <script>
      const splashTheme = new URLSearchParams(location.search).get('theme')
      if (splashTheme === 'dark') document.documentElement.dataset.theme = 'dark'
      if (splashTheme === 'light') document.documentElement.dataset.theme = 'light'
    </script>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { color: #17181a; background: #f8f8f6; }
      main {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        padding: 32px;
      }
      .title {
        margin: 0;
        font-size: 32px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      :root[data-theme='dark'] body {
        color: #f3f4f6;
        background: #141416;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) body { color: #f3f4f6; background: #141416; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="title">Casleo</h1>
    </main>
  </body>
</html>
