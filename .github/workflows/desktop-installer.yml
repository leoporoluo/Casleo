name: Desktop installer (Windows x64)

# Build the unsigned Windows x64 NSIS installer.
#
# - Push a tag such as `v0.1.0` to publish a GitHub Release with the installer.
# - Run the workflow manually to fetch the installer as a workflow artifact.
#
# No repository secrets are required: the installer is unsigned and every
# dependency comes from the public npm registry.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build and package the unsigned installer
        run: npm run package:win

      - name: Collect the installer
        id: artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'dist/*.exe' |
            Where-Object { $_.Name -notmatch 'uninstall' } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'electron-builder produced no installer executable'
          }
          "path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$($installer.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: casleo-windows-x64-installer
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Attach the installer to the Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Casleo $tag" --notes "Unsigned Windows x64 installer. Windows SmartScreen may warn on first run."
          }
          gh release upload $tag "${{ steps.artifact.outputs.path }}" --clobber
