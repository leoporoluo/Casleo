<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Casleo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #root {
        height: 100%;
        box-sizing: border-box;
        padding: 12px;
        overflow-y: auto;
        overflow-x: hidden;
      }
      html[data-surface="page"] #root {
        padding: 24px;
      }
      .casleo-shell {
        min-width: 0;
      }
      html[data-surface="page"] .casleo-shell {
        max-width: 720px;
        margin: 0 auto;
      }
      /* Reasoning-level cards (panel/levels.ts). Colours come from the host
         theme variables the SDK paints on the root. */
      .casleo-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .casleo-field-label {
        font-size: 0.8125rem;
        font-weight: 500;
      }
      .casleo-field-note {
        font-size: 0.75rem;
        line-height: 1.45;
        color: var(--surface-muted-foreground, var(--oc-muted, gray));
      }
      .casleo-field[data-empty="true"] .casleo-field-note {
        color: var(--warning-text, var(--oc-warning-text, inherit));
      }
      .casleo-levels {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .casleo-level {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 58px;
        height: 30px;
        padding: 0 12px;
        border: 1px dashed var(--interactive-border, var(--oc-border, currentColor));
        border-radius: 8px;
        background: transparent;
        color: var(--surface-muted-foreground, var(--oc-muted, inherit));
        font-family: var(--font-mono, var(--oc-mono, monospace));
        font-size: 0.75rem;
        line-height: 1;
        cursor: pointer;
        transition: background 150ms ease-out, border-color 150ms ease-out, color 150ms ease-out;
      }
      .casleo-level:hover {
        background: var(--interactive-hover, var(--oc-hover, transparent));
      }
      .casleo-level[data-on="true"] {
        border-style: solid;
        border-color: var(--primary, var(--oc-primary, currentColor));
        background: color-mix(in srgb, var(--primary, var(--oc-primary, currentColor)) 12%, transparent);
        color: var(--primary-text, var(--oc-primary-text, inherit));
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
