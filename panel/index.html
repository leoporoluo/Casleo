<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Casleo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #root {
        height: 100%;
        box-sizing: border-box;
        padding: 12px;
        overflow-y: auto;
        overflow-x: hidden;
      }
      html[data-surface="page"] #root {
        padding: 24px;
      }
      .casleo-shell {
        min-width: 0;
      }
      html[data-surface="page"] .casleo-shell {
        max-width: 720px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
