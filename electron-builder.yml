appId: app.casleo.desktop
productName: Casleo
directories:
  output: release

files:
  - dist/index.html
  - dist/assets/**/*
  - dist-electron/**/*
  - casleo-agent-core/dist/**/*
  - casleo-agent-core/package.json
  - package.json
  - "!**/*.map"

# RPC worker and native keyring need real filesystem paths.
asar: false

extraResources:
  - from: build/icon.ico
    to: icon.ico

mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  # Ad-hoc sign so Gatekeeper doesn't report the app as "damaged".
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: [arm64]

linux:
  icon: build/icon.png
  category: Development
  target:
    - target: dir
      arch: [x64]

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Casleo
  artifactName: ${productName}-Setup-${version}.exe

compression: normal

publish: null
